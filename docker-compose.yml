services:

  debug:
    image: python

  web:
    build: .
    user: root
    volumes:
      - .:/app
      - web-attachments:/app/attachments
      - web-coverage:/var/coverage
    ports:
      - "8000:8000"
    command: bin/wait-for-deps.sh ./manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - rabbitmq
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq//
      - DATABASE_URL=postgresql://writeinpublic:devpassword@db/writeinpublic
      - DJANGO_DEBUG=True
      - DJANGO_DEBUG_TOOLBAR
      - DJANGO_SECRET_KEY=not-secret-in-dev
      - DJANGO_TESTING
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - SESSION_COOKIE_DOMAIN=127.0.0.1.nip.io

  worker:
    build: .
    user: root
    volumes:
      - .:/app
      - web-attachments:/app/attachments
    command: bin/wait-for-deps.sh celery -A writeit worker
    depends_on:
      - db
      - rabbitmq
    environment:
      - DATABASE_URL=postgresql://writeinpublic:devpassword@db/writeinpublic
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=not-secret-in-dev
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend

  beat:
    build: .
    user: root
    volumes:
      - .:/app
      - beat-data:/var/celerybeat
    command: bin/wait-for-deps.sh celery -A writeit beat --pidfile= -s /var/celerybeat/celerybeat-schedule
    depends_on:
      - db
      - rabbitmq
    environment:
      - DATABASE_URL=postgresql://writeinpublic:devpassword@db/writeinpublic
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=not-secret-in-dev
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend

  db:
    image: postgres:13.18
    environment:
      - POSTGRES_USER=writeinpublic
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=writeinpublic
    volumes:
      - db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.7.28-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK=1000MiB
    ports:
      - 5672:5672
      - 15672:15672

volumes:
  web-attachments:
  web-coverage:
  db-data:
  rabbitmq-data:
  beat-data:
